<style>
:root{--in:#0d0a05;--c1:#1c150a;--c2:#130e06;--bg:#0b0907;--gold:#e8bd52;--gold2:#b8862b;--gold3:#fff0b8;--tx:#f6ecd2;--mut:#b3a27c;--line:#33280f;--ok:#5fd08a;--bad:#ff7a7a;--warn:#f0b44a;--blue:#7fb2ff}
html[data-theme="maroon"]{--bg:#140608;--c1:#2a1117;--c2:#1a090c;--in:#190a0d;--gold:#f0c46a;--tx:#fbeee0;--mut:#d3b58f;--line:#4a1f26}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Poppins,"Tiro Devanagari Hindi",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Tiro Devanagari Hindi",Poppins,serif;color:var(--gold);margin:0 0 8px}
.hide{display:none!important}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--gold2);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,189,82,.18)}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}

.btn:active{transform:scale(.97)}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:18px;padding:16px}

#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}

.bdg{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid;margin-right:6px}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;font-size:28px;background:linear-gradient(135deg,#f3cf6a,var(--gold2));color:#1a1204;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;z-index:30}

.bl .bi div{padding:6px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
#wb{position:fixed;inset:0;z-index:50;background:#2a2a2a;display:none;flex-direction:column}
#wb.on{display:flex}
.wt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px));background:#151515;flex:none}

#wbst2{position:relative}
#cbg,#cink{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}

.wtitle{background:#222;border:1px solid #444;color:#eee;border-radius:10px;height:40px;width:150px;flex:none;font-size:14px;padding:0 10px}

<script>
